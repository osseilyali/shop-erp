<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop ERP</title>
<meta name="description" content="Stock, purchases and imports, sales and customer credit, expenses and profit for an appliance and plumbing shop.">
<meta name="theme-color" content="#0A6A86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,500..800;1,62..125,500..800&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: desktop = fixed left rail + scrolling work pane; phone = single column with a bottom tab bar.
   Every screen opens with its summary, then the working list. Money is GNF throughout. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --sunken:#E7ECEE; --line:#D6DDE1; --line-strong:#B8C4CA;
  --ink:#13202A; --muted:#566570; --faint:#84929B;
  --accent:#0A6A86; --accent-hover:#08566D; --accent-ink:#FFFFFF; --accent-soft:#DBEEF3;
  --copper:#9C5320; --copper-soft:#F5E6DA;
  --good:#1A7547; --good-soft:#DCF0E4; --warn:#955600; --warn-soft:#F9EACD; --bad:#B42318; --bad-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(19,32,42,.07),0 6px 18px rgba(19,32,42,.07);
  --scrim:rgba(10,18,24,.46);
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#151F25; --sunken:#1B272E; --line:#26353E; --line-strong:#3A4B55;
    --ink:#E3EBEF; --muted:#98A7B1; --faint:#6E7E88;
    --accent:#4FB3CE; --accent-hover:#6FC4DB; --accent-ink:#04222B; --accent-soft:#12313D;
    --copper:#E29C66; --copper-soft:#392517;
    --good:#5CC48D; --good-soft:#123121; --warn:#E6A546; --warn-soft:#35280F; --bad:#F08574; --bad-soft:#3B1C18;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#151F25; --sunken:#1B272E; --line:#26353E; --line-strong:#3A4B55;
  --ink:#E3EBEF; --muted:#98A7B1; --faint:#6E7E88;
  --accent:#4FB3CE; --accent-hover:#6FC4DB; --accent-ink:#04222B; --accent-soft:#12313D;
  --copper:#E29C66; --copper-soft:#392517;
  --good:#5CC48D; --good-soft:#123121; --warn:#E6A546; --warn-soft:#35280F; --bad:#F08574; --bad-soft:#3B1C18;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:1.7rem;font-weight:760;line-height:1.1}
h2{font-size:1.06rem;font-weight:700}
h3{font-size:.95rem;font-weight:650}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.01em}
.muted{color:var(--muted)}
.right{text-align:right}
svg.i{width:18px;height:18px;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:18px 12px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px;text-decoration:none}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-stretch:72%;font-size:15px;flex:none;letter-spacing:.02em}
.brand-name{font-family:var(--font-display);font-weight:750;font-stretch:85%;font-size:15.5px;line-height:1.15;overflow-wrap:anywhere}
.brand-sub{font-size:11.5px;color:var(--muted)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:600;padding:0 10px 5px}
.navlink{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.navlink:hover{background:var(--sunken);color:var(--ink)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlink .badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:2px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.live{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-inline:12px}
.mtop{display:none;align-items:center;gap:10px}
.mtop .brand-name{flex:1;min-width:0}

.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;text-decoration:none;color:var(--muted);padding:5px 0;border-radius:8px;background:none;border:0;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab.sell .ti{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:40px;height:26px;display:grid;place-items:center}
.tab.sell .ti svg{width:17px;height:17px}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tabbar{display:grid}
  .main{padding-block:14px calc(90px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-inline:0;gap:16px}
  .mtop{display:flex}
  h1{font-size:1.45rem}
}

/* ---------- building blocks ---------- */
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.vh > div:first-child{min-width:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.big{height:46px;font-size:15px;width:100%}
.btn.iconbtn{width:34px;padding:0}
.btn.sm.iconbtn{width:30px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;text-decoration:none;color:inherit}
a.tile:hover{border-color:var(--line-strong)}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--font-display);font-stretch:82%;font-weight:720;font-size:1.65rem;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v small{font-size:.5em;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:.04em}
.tile .s{font-size:12px;color:var(--muted)}
.tile.neg .v{color:var(--bad)}
.tile.up .v{color:var(--good)}
.tile.hl{background:var(--accent-soft);border-color:transparent}
.tile.hl .k{color:var(--accent)}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.tile .v{font-size:1.35rem}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-b{padding:14px}
.panel-b.tight{padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:650;border-top:1px solid var(--line-strong);border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunken)}
.tbl tr.on td{background:var(--accent-soft, #eef3fb)}
.tbl tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl tr.quiet td{color:var(--faint)}
.tbl td.neg{color:var(--bad)}
.tbl .faint{color:var(--faint)}
#rep-day{width:auto;max-width:170px}
.tbl tr.void td{color:var(--faint);text-decoration:line-through}
.tbl tr.void td .pill{text-decoration:none}
.tbl td .sub{display:block}
.tbl .inp{height:34px}
@media (max-width:640px){.hide-sm{display:none}.tbl td,.tbl th{padding-inline:9px}}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.copper{background:var(--copper-soft);color:var(--copper)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:40px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 11px;width:100%;min-width:0}
select.inp{padding-right:6px}
textarea.inp{height:auto;min-height:62px;padding:9px 11px;resize:vertical}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.n{text-align:right;font-variant-numeric:tabular-nums}
.inp.bad{border-color:var(--bad)}
.hint{font-size:11.5px;color:var(--faint)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline > .grow{flex:1;min-width:140px}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;padding:2px;background:var(--sunken);gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1;min-width:180px;max-width:420px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.search .inp{padding-left:34px}
.toolbar select.inp{width:auto;min-width:150px}

.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid var(--line)}
.banner b{display:block}
.banner.info{background:var(--accent-soft)}
.empty{padding:30px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty strong{color:var(--ink);font-family:var(--font-display);font-stretch:85%;font-size:1.02rem}
.warnline{font-size:12px;color:var(--warn);margin-top:4px}
.errline{font-size:12px;color:var(--bad)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--sunken)}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.li .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.step{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--surface);text-decoration:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.step.done{border-style:solid;background:var(--good-soft);border-color:transparent}
.step .sn{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.step.done .sn{color:var(--good)}
.step b{font-weight:600}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* sell */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:14px;align-items:start}
@media (max-width:1040px){.pos{grid-template-columns:minmax(0,1fr)}}
.pitem .pst{font-size:12px;color:var(--muted);white-space:nowrap}
.pitem .pst.neg{color:var(--bad)}
.pitem .pp{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:84px;text-align:right}
.cart{position:sticky;top:12px}
@media (max-width:1040px){.cart{position:static}}
.cline{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.cline:first-child{padding-top:0}
.cl-top{display:flex;gap:8px;align-items:flex-start}
.cl-top .nm{flex:1;min-width:0}
.cl-top .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.cl-bot{display:flex;gap:7px;align-items:center}
.cl-bot .qty{width:74px;flex:none}
.cl-bot .x{color:var(--faint)}
.cl-bot .pr{flex:1;min-width:90px}
.cl-total{min-width:96px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.totals{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.totals .row{display:flex;justify-content:space-between;gap:12px}
.totals .grand{font-family:var(--font-display);font-stretch:85%;font-size:1.35rem;font-weight:750;padding-top:6px;border-top:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.cl-cost{display:flex;gap:8px;align-items:center}
.cl-cost label{width:84px;flex:none;font-size:12.5px;color:var(--muted);font-weight:500;margin:0}
.cl-cost .inp{flex:1;min-width:0}
.field > label.check,label.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;font-weight:400;color:var(--ink);line-height:1.45}
label.check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
/* attached documents */
.docs{display:flex;flex-wrap:wrap;gap:6px}
.doc{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:32px;padding:0 7px 0 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
button.doc:hover{background:var(--sunken)}
.doc .i{width:15px;height:15px;color:var(--muted);flex:none}
.doc-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.doc-s{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.doc-x{border:0;background:none;padding:3px;margin-left:-2px;border-radius:5px;cursor:pointer;color:var(--muted);display:inline-flex}
.doc-x:hover{background:var(--sunken);color:var(--ink)}
.doc-x .i{width:13px;height:13px}
.docbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r)}
.docbar .lbl{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.docbar .lbl .i{width:16px;height:16px}
.docbar .spacer{flex:1}
.doc-img{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:8px;border:1px solid var(--line)}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:580px;display:flex;flex-direction:column;margin-block:auto;outline:none}
.modal.wide{max-width:980px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:1.15rem}
.modal-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:18px}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px}
.modal-f .spacer{flex:1}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sect-h h3{font-size:.98rem}
@media (max-width:600px){
  .scrim{padding:max(10px,env(safe-area-inset-top,0px)) 0 0}
  .modal{border-radius:14px 14px 0 0;max-width:none;margin-block:auto 0}
  .modal.wide{max-width:none}
  .modal-h,.modal-b,.modal-f{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .modal-f{border-radius:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
.confirmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;width:100%}
.confirmbar p{flex:1;min-width:200px;color:var(--bad);font-weight:500}

/* invoice */
.inv{position:relative;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);border-radius:var(--r);padding:16px;font-variant-numeric:tabular-nums;overflow:hidden}
.inv-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.inv-shop{font-family:var(--font-display);font-stretch:80%;font-weight:780;font-size:1.3rem;line-height:1.1}
.inv-meta{text-align:right}
.inv-meta .mono{font-size:14px;font-weight:500}
.inv .tbl td,.inv .tbl th{padding-inline:6px}
.stamp{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid var(--bad);color:var(--bad);font-family:var(--font-display);font-weight:800;font-size:2.6rem;letter-spacing:.12em;padding:2px 18px;border-radius:8px;opacity:.75;pointer-events:none}
.copytext{width:100%;min-height:180px;font-family:var(--font-mono);font-size:12px}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.bar-track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent)}
.bar-fill.copper{background:var(--copper)}
.chart{display:block;width:100%;min-width:560px;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b1{fill:var(--accent)}
.chart .b2{fill:var(--good)}
.chart .now{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (max-width:860px){.toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion: no-preference){
  .toast{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
}

/* ---------- sign-in gate ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px 22px;display:flex;flex-direction:column;gap:16px}
.gate-card .brand{padding:0}
.gate-card h1{font-size:1.45rem}
.gate-card p{color:var(--muted)}
.gate-card ol{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.gate-card code{font-family:var(--font-mono);font-size:12px;background:var(--sunken);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.gbtn svg{width:18px;height:18px}
.rail-foot .who{font-size:12px;color:var(--muted);padding:2px 10px;overflow-wrap:anywhere}

/* ---------- money accounts ---------- */
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.tile:hover{border-color:var(--line-strong)}
.tile .v.negv{color:var(--bad)}
.li .amt.in{color:var(--good)}
div.li{cursor:default}
div.li:hover{background:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}

.acc-chips .chip{height:40px;padding:0 16px;font-size:14px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- dollar rate ---------- */
.ratechip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;height:28px;padding:0 10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap}
.ratechip.old{border-color:var(--warn);color:var(--warn)}

/* ---------- invoice: the shop's paper layout, on screen and printed on A4 ---------- */
.modal.mid{max-width:760px}
.ifr{--ib:#2763AE;--ir:#B3261E;--ii:#14202B;--im:#4C5B68;position:relative;background:#fff;color:var(--ii);font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.35;display:flex;flex-direction:column;gap:.95em;padding:1.6em 1.4em;border:1px solid var(--line);border-radius:var(--r);font-variant-numeric:tabular-nums;overflow:hidden}
.ifr-hd{text-align:center;color:var(--ib);display:flex;flex-direction:column;align-items:center;gap:.25em;padding-bottom:.9em;border-bottom:2px solid var(--ib)}
.ifr-name{font-family:Archivo,"Arial Narrow",sans-serif;font-weight:800;font-stretch:72%;font-size:3.6em;line-height:.95;letter-spacing:.02em;overflow-wrap:anywhere;text-wrap:balance}
.ifr-tag,.ifr-addr,.ifr-mail,.ifr-tel,.ifr-date,.ifr-lbl{font-family:Archivo,"Arial Narrow",sans-serif;font-style:italic;font-stretch:85%}
.ifr-tag{font-weight:700;font-size:1.2em;text-transform:uppercase;font-stretch:80%}
.ifr-addr{font-weight:600;font-size:1.08em}
.ifr-tel{background:var(--ib);color:#fff;border-radius:99px;padding:.15em 1.2em;font-weight:700;font-size:1.13em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ifr-mail{font-weight:600;font-size:1.04em}
.ifr-row{display:flex;justify-content:space-between;align-items:baseline;gap:.6em 1.2em;flex-wrap:wrap}
.ifr-fact{font-family:Archivo,"Arial Narrow",sans-serif;font-weight:800;font-stretch:78%;font-size:2.05em;color:var(--ib)}
.ifr-no{color:var(--ir);font-family:"Courier New",ui-monospace,monospace;font-weight:700;font-size:.78em;margin-left:.3em;letter-spacing:.04em}
.ifr-date{font-weight:600;color:var(--ib);font-size:1.17em}
.ifr-date b{color:var(--ii);font-style:normal;font-family:Inter,sans-serif;font-weight:600;font-size:.9em}
.ifr-line{display:flex;align-items:baseline;gap:.5em;min-width:0}
.ifr-lbl{font-weight:600;color:var(--ib);font-size:1.12em;white-space:nowrap}
.ifr-fill{flex:1;min-width:0;border-bottom:1px dotted var(--ib);padding:0 .4em .1em;font-weight:600;min-height:1.45em;overflow-wrap:anywhere}
.ifr-m{font-weight:400;color:var(--im)}
.ifr-words .ifr-fill{font-weight:500;font-style:italic}
.ifr-tw{overflow-x:auto}
.ifr-t{width:100%;min-width:31em;border-collapse:separate;border-spacing:0;border:1.5px solid var(--ib);border-radius:.6em;overflow:hidden}
.ifr-t th{font-family:Archivo,"Arial Narrow",sans-serif;font-weight:800;font-stretch:85%;color:var(--ib);font-size:1.12em;text-align:left;padding:.5em .6em;border-bottom:1.5px solid var(--ib);white-space:nowrap}
.ifr-t td{padding:.45em .6em;border-bottom:.75px solid var(--ib);vertical-align:top;color:var(--ii)}
.ifr-t th+th,.ifr-t td+td{border-left:1.5px solid var(--ib)}
.ifr-t .c-no{width:2.6em;text-align:center;color:var(--ib);font-weight:600}
.ifr-t .c-q{width:4em;text-align:center}
.ifr-t .c-pu,.ifr-t .c-pt{width:8.5em;text-align:right;white-space:nowrap}
.ifr-t th.c-q,.ifr-t th.c-pu,.ifr-t th.c-pt{text-align:center}
.ifr-t td small{display:block;color:var(--im);font-size:.86em;margin-top:.1em}
.ifr-t .t-lbl2{text-align:right;color:var(--im)}
.ifr-t .t-val2{text-align:right;white-space:nowrap}
.ifr-t tr.tot td{border-bottom:0;border-top:1.5px solid var(--ib);font-weight:700}
.ifr-t td.t-lbl{font-family:Archivo,"Arial Narrow",sans-serif;font-weight:800;font-stretch:85%;color:var(--ib);font-size:1.4em;text-align:center;letter-spacing:.04em}
.ifr-t td.t-val{font-size:1.22em;text-align:right;white-space:nowrap}
.ifr-pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:.6em 1.4em}
.ifr-ft{margin-top:auto;display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:.8em;align-items:end;padding-top:2.2em}
.ifr-sig{font-family:Archivo,"Arial Narrow",sans-serif;font-weight:800;font-stretch:85%;color:var(--ib);font-size:1.17em;text-align:center}
.ifr-sig span{display:block;border-top:.75px solid var(--im);margin:3.5em .4em .3em}
.ifr-nb{font-family:Archivo,"Arial Narrow",sans-serif;font-stretch:88%;font-size:1em;text-align:center;padding-bottom:.3em}
.ifr-nb i{color:var(--ib);font-weight:700}
.ifr-meta{font-size:.8em;color:var(--im);text-align:center}
.ifr-void{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid var(--ir);color:var(--ir);font-family:Archivo,sans-serif;font-weight:800;font-size:3em;letter-spacing:.12em;padding:.05em .5em;border-radius:.2em;opacity:.75;pointer-events:none}
@media (max-width:600px){.ifr{font-size:11.5px;padding:1.2em .9em}.ifr-ft{grid-template-columns:1fr 1fr}.ifr-nb{grid-column:1/-1;order:-1}.ifr-t{min-width:0}.ifr-t th{white-space:normal;font-size:1em;padding:.45em .4em}.ifr-t td{padding:.45em .4em}.ifr-t .c-no{width:1.8em}.ifr-t .c-q{width:2.6em}.ifr-t .c-pu,.ifr-t .c-pt{width:auto}}
/* ---------- simple invoice: black text and thin lines, to save ink ---------- */
.ivs{--ivk:#111;--ivm:#555;--ivl:#9a9a9a;position:relative;background:#fff;color:var(--ivk);font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:1.3em;padding:1.8em 1.6em;border:1px solid var(--line);border-radius:var(--r);font-variant-numeric:tabular-nums;overflow:hidden}
.ivs-top{display:flex;justify-content:space-between;gap:1em 1.5em;align-items:flex-start;flex-wrap:wrap}
.ivs-shop{min-width:0}
.ivs-shop div{color:var(--ivm);font-size:.92em;overflow-wrap:anywhere}
.ivs-shop .ivs-name{font-family:Archivo,"Arial Narrow",sans-serif;font-weight:800;font-stretch:72%;font-size:3em;line-height:.95;letter-spacing:.02em;color:#2763AE;margin-bottom:.1em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ivs-shop .ivs-tag{color:var(--ivk);font-size:.98em;margin:.15em 0 .35em}
.ivs-doc{text-align:right;margin-left:auto}
.ivs-title{font-size:1.75em;font-weight:300;letter-spacing:.18em;line-height:1.15}
.ivs-no{font-size:1.12em;font-weight:600;margin-top:.15em}
.ivs-d{color:var(--ivm);font-size:.92em;margin-top:.1em}
.ivs-hr{border:0;border-top:.5pt solid var(--ivl);margin:0}
.ivs-client{display:flex;justify-content:space-between;gap:.4em 1.4em;flex-wrap:wrap}
.ivs-client span,.ivs-words span{color:var(--ivm)}
.ivs-tw{overflow-x:auto}
.ivs-t{width:100%;border-collapse:collapse}
.ivs-t th{font-size:.85em;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ivm);text-align:left;padding:0 .5em .45em;border-bottom:.5pt solid var(--ivl);white-space:nowrap}
.ivs-t td{padding:.55em .5em;vertical-align:top;color:var(--ivk)}
.ivs-t tbody tr+tr td{border-top:.25pt solid #d4d4d4}
.ivs-t td small{display:block;color:var(--ivm);font-size:.86em}
.ivs-t .n{text-align:right;white-space:nowrap}
.ivs-t .c{text-align:center}
.ivs-t .c-no{width:2em;color:var(--ivm)}
.ivs-sum{margin-left:auto;width:min(100%,23em);display:flex;flex-direction:column;gap:.35em;border-top:.5pt solid var(--ivl);padding-top:.65em}
.ivs-sum div{display:flex;justify-content:space-between;gap:1em}
.ivs-sum span{color:var(--ivm)}
.ivs-sum .v,.ivs-sum b{color:var(--ivk);white-space:nowrap}
.ivs-due{font-size:1.2em;font-weight:700}
.ivs-due span{color:var(--ivk)!important;white-space:nowrap}
.ivs-words{font-size:.95em}
.ivs-wm{position:relative;flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;min-height:26em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ivs-wm-ring{position:absolute;left:50%;top:50%;width:25em;height:25em;transform:translate(-50%,-50%);border-radius:50%;border:.5pt solid #dde6f2}
.ivs-wm-mono{position:relative;font-family:Archivo,"Arial Narrow",sans-serif;font-weight:800;font-stretch:72%;font-size:12em;line-height:.8;color:transparent;-webkit-text-stroke:.8pt #c3d3ea;letter-spacing:-.02em}
.ivs-wm-thanks{position:relative;font-family:Archivo,"Arial Narrow",sans-serif;font-stretch:85%;font-style:italic;font-weight:600;font-size:1.4em;color:#2763AE}
.ivs-wm-cats{position:relative;font-size:.84em;color:#666;letter-spacing:.12em;text-transform:uppercase;text-align:center;max-width:24em}
.ivs-wm.sm{min-height:17em;gap:.6em}
.ivs-wm.sm .ivs-wm-ring{width:16em;height:16em}
.ivs-wm.sm .ivs-wm-mono{font-size:7em}
.ivs-wm.sm .ivs-wm-thanks{font-size:1.15em}
.ivs-wm.sm .ivs-wm-cats{display:none}
.ivs-sig{margin-top:auto;display:flex;justify-content:space-between;gap:2em;padding-top:2.5em}
.ivs-sig div{width:15em;max-width:45%;text-align:center;color:var(--ivm);font-size:.92em}
.ivs-sig div::before{content:"";display:block;border-top:.5pt solid var(--ivl);margin-bottom:.4em}
.ivs-nb{text-align:center;font-size:.86em;color:var(--ivm)}
.ivs-meta{text-align:center;font-size:.76em;color:#888}
.ivs-void{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:2px solid #111;color:#111;font-weight:700;font-size:2.6em;letter-spacing:.12em;padding:.05em .5em;opacity:.5;pointer-events:none}
@media (max-width:600px){.ivs{font-size:12px;padding:1.3em 1em}.ivs-doc{text-align:left;margin-left:0}.ivs-t th,.ivs-t td{padding-left:.3em;padding-right:.3em}}
#print-area{display:none}
@media print{
  @page{size:A4;margin:0}
  :root{padding:0}
  html,body{background:#fff}
  body.printing > *:not(#print-area){display:none!important}
  body.printing #print-area{display:block}
  #print-area .ifr{width:210mm;min-height:296mm;padding:14mm 14mm 11mm;border:0;border-radius:0;font-size:10.6pt;gap:4.4mm}
  #print-area .ifr-t{min-width:0}
  #print-area .ifr-tw{overflow:visible}
  #print-area .ifr-ft{grid-template-columns:1fr 1.6fr 1fr}
  #print-area .ifr-nb{grid-column:auto;order:0}
  #print-area .ivs{width:210mm;min-height:296mm;padding:16mm 16mm 12mm;border:0;border-radius:0;font-size:10pt;gap:6mm}
  #print-area .ivs-tw{overflow:visible}
  #print-area .ivs-doc{text-align:right;margin-left:auto}
  /* Long invoices run onto a second page: repeat the page padding on every page and never cut a line or the totals in half. */
  #print-area .ivs,#print-area .ifr{-webkit-box-decoration-break:clone;box-decoration-break:clone}
  #print-area tr,#print-area .ivs-sum,#print-area .ivs-sig,#print-area .ivs-words{break-inside:avoid}
}
</style>
